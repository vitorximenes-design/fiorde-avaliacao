<body>

<div class="card">

    <h1>Avaliação de Atendimento</h1>

    <div class="subtitulo">
        Queremos saber como foi sua experiência.
    </div>

    <label for="cliente">Empresa</label>

    <input
        type="text"
        id="cliente"
        placeholder="Digite o nome da empresa"
    >

    <label>Como você avalia nosso atendimento?</label>

    <div class="estrelas">
        <span class="estrela" data-nota="1">★</span>
        <span class="estrela" data-nota="2">★</span>
        <span class="estrela" data-nota="3">★</span>
        <span class="estrela" data-nota="4">★</span>
        <span class="estrela" data-nota="5">★</span>
    </div>

    <label for="comentario">Comentário</label>

    <textarea
        id="comentario"
        placeholder="Deixe um comentário (opcional)">
    </textarea>

    <button id="enviar">
        ENVIAR AVALIAÇÃO
    </button>

    <div id="mensagem"></div>

</div>

<script>

const SUPABASE_URL =
    "https://nniariwvpyqleeryzksh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2ElxL2VDVn77d4O6juXT6g_VzxGcTnU";

let notaSelecionada = 0;

const estrelas =
    document.querySelectorAll(".estrela");

const botao =
    document.getElementById("enviar");

const cliente =
    document.getElementById("cliente");

const comentario =
    document.getElementById("comentario");

const mensagem =
    document.getElementById("mensagem");


estrelas.forEach(estrela => {

    estrela.addEventListener("click", () => {

        notaSelecionada =
            Number(estrela.dataset.nota);

        estrelas.forEach(e => {

            const numero =
                Number(e.dataset.nota);

            e.classList.toggle(
                "selecionada",
                numero <= notaSelecionada
            );

        });

    });

});


botao.addEventListener("click", async () => {

    mensagem.textContent = "";
    mensagem.className = "";

    if (!cliente.value.trim()) {

        mensagem.textContent =
            "Digite o nome da empresa.";

        mensagem.className = "erro";

        return;
    }

    if (notaSelecionada === 0) {

        mensagem.textContent =
            "Selecione uma nota de 1 a 5 estrelas.";

        mensagem.className = "erro";

        return;
    }

    botao.disabled = true;
    botao.textContent = "ENVIANDO...";


    const dados = {

        cliente: cliente.value.trim(),

        nota: notaSelecionada,

        comentario:
            comentario.value.trim() || null

    };


    try {

        const resposta = await fetch(
            SUPABASE_URL + "/rest/v1/avaliacoes",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify(dados)
            }
        );


        if (!resposta.ok) {

            const erro =
                await resposta.text();

            throw new Error(erro);
        }


        mensagem.textContent =
            "Obrigado pela sua avaliação!";

        mensagem.className =
            "sucesso";


        cliente.value = "";
        comentario.value = "";
        notaSelecionada = 0;

        estrelas.forEach(e =>
            e.classList.remove("selecionada")
        );


    } catch (erro) {

        console.error(erro);

        mensagem.textContent =
            "Não foi possível enviar a avaliação.";

        mensagem.className =
            "erro";

    }


    botao.disabled = false;
    botao.textContent =
        "ENVIAR AVALIAÇÃO";

});

</script>

</body>
